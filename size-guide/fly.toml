# fly.toml per guida-taglie-pro
app = "guida-taglie-pro"
primary_region = "ams"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SHOPIFY_APP_URL = "https://guida-taglie-pro.fly.dev"
  SHOPIFY_API_KEY = "9b5f3dc449201dfd5c586a554e156d51"
  SCOPES = "write_products,write_metaobjects,write_metaobject_definitions"
  DATABASE_URL = "file:/data/dev.sqlite"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
